<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>PrismPress 发布助手</title>
<style>body{font:14px system-ui;width:330px;padding:18px;color:#292436}h1{font-size:19px}p{line-height:1.6}button{background:#7050b0;color:white;border:0;border-radius:9px;padding:12px;width:100%;margin-top:18px}button:disabled{opacity:.5}#status{white-space:pre-wrap}input{width:100%}</style>
<h1>PrismPress 发布助手 · 原型</h1>
<p>打开小红书空白长文，选择从 PrismPress 导出的交接文件。</p>
<input id="file" type="file" accept=".json,application/json"><p id="summary"></p>
<button id="fill" disabled>填入当前小红书长文</button>
<p id="status" role="status">只填入内容。请暂存并重开检查后，再自行决定发布。</p>
<script type="module" src="popup.mjs"></script></html>
